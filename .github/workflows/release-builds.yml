name: release-builds

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, such as v0.1.0
        required: true
        type: string
      target_ref:
        description: Git ref to build from
        required: false
        default: main
        type: string
      release_name:
        description: Optional release title
        required: false
        default: ''
        type: string
      prerelease:
        description: Mark release as prerelease
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Python distributions
        working-directory: python
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Upload Python artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-python
          path: |
            python/dist/*.whl
            python/dist/*.tar.gz
          if-no-files-found: error

  build-node:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Build Node package
        working-directory: node
        run: |
          npm ci
          npm run build

      - name: Package Node release archive without examples
        run: |
          rm -rf release/node
          mkdir -p release/node/dist
          cp node/package.json release/node/
          cp node/README.md release/node/
          cp node/README.en.md release/node/
          cp node/directives.md release/node/
          cp node/directives.en.md release/node/
          cp -R node/dist/src release/node/dist/
          tar -C release -czf mkp-node-${{ inputs.tag }}.tar.gz node

      - name: Upload Node artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-node
          path: mkp-node-${{ inputs.tag }}.tar.gz
          if-no-files-found: error

  build-cpp:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}

      - name: Configure CMake
        run: |
          cmake -S cpp -B cpp/build-release \
            -DCMAKE_BUILD_TYPE=Release \
            -DMKP_CPP_BUILD_EXAMPLES=OFF \
            -DMKP_CPP_BUILD_TESTS=OFF \
            -DMKP_CPP_BUILD_HTTP_TOOLS=ON

      - name: Build C++ targets
        run: cmake --build cpp/build-release --config Release --parallel

      - name: Package C++ release archive without examples
        run: |
          rm -rf release/cpp
          mkdir -p release/cpp/bin
          cp cpp/README.md release/cpp/
          cp cpp/README.en.md release/cpp/
          cp cpp/directives.md release/cpp/
          cp cpp/directives.en.md release/cpp/
          for file in mkp mkp-converter mkp-json2log mkp-log2json mkp-file-server mkp-server; do
            if [ -f "cpp/build-release/$file" ]; then
              cp "cpp/build-release/$file" release/cpp/bin/
            fi
          done
          tar -C release -czf mkp-cpp-${{ inputs.tag }}-linux-x64.tar.gz cpp

      - name: Upload C++ artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-cpp
          path: mkp-cpp-${{ inputs.tag }}-linux-x64.tar.gz
          if-no-files-found: error

  build-dotnet:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore .NET projects
        run: |
          dotnet restore dotnet/src/MkpKit/MkpKit.csproj
          dotnet restore dotnet/src/MkpKit.Cli/MkpKit.Cli.csproj
          dotnet restore dotnet/src/MkpKit.Client/MkpKit.Client.csproj
          dotnet restore dotnet/src/MkpKit.Converter/MkpKit.Converter.csproj
          dotnet restore dotnet/src/MkpKit.FileServer/MkpKit.FileServer.csproj
          dotnet restore dotnet/src/MkpKit.Server/MkpKit.Server.csproj

      - name: Pack .NET library
        run: dotnet pack dotnet/src/MkpKit/MkpKit.csproj -c Release -o dotnet/artifacts/packages

      - name: Publish .NET executables
        run: |
          dotnet publish dotnet/src/MkpKit.Cli/MkpKit.Cli.csproj -c Release -o dotnet/artifacts/publish/mkp-dotnet-cli
          dotnet publish dotnet/src/MkpKit.Client/MkpKit.Client.csproj -c Release -o dotnet/artifacts/publish/mkp-dotnet-client
          dotnet publish dotnet/src/MkpKit.Converter/MkpKit.Converter.csproj -c Release -o dotnet/artifacts/publish/mkp-dotnet-converter
          dotnet publish dotnet/src/MkpKit.FileServer/MkpKit.FileServer.csproj -c Release -o dotnet/artifacts/publish/mkp-dotnet-file-server
          dotnet publish dotnet/src/MkpKit.Server/MkpKit.Server.csproj -c Release -o dotnet/artifacts/publish/mkp-dotnet-server

      - name: Package .NET release archive
        run: |
          rm -rf release/dotnet
          mkdir -p release/dotnet
          cp dotnet/README.md release/dotnet/
          cp dotnet/README.en.md release/dotnet/
          cp dotnet/directives.md release/dotnet/
          cp dotnet/directives.en.md release/dotnet/
          cp -R dotnet/artifacts release/dotnet/
          tar -C release -czf mkp-dotnet-${{ inputs.tag }}.tar.gz dotnet

      - name: Upload .NET artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-dotnet
          path: mkp-dotnet-${{ inputs.tag }}.tar.gz
          if-no-files-found: error

  build-java:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Java modules without examples archive output
        working-directory: java
        run: |
          chmod +x gradlew
          ./gradlew :core:build :cli:build :client:build :server:build :file-server:build :converter:build

      - name: Package Java release archive without examples
        run: |
          rm -rf release/java
          mkdir -p release/java/libs
          cp java/README.md release/java/
          cp java/README.en.md release/java/
          cp java/directives.md release/java/
          cp java/directives.en.md release/java/
          find java/core/build/libs -maxdepth 1 -type f -name '*.jar' -exec cp {} release/java/libs/ \;
          find java/cli/build/libs -maxdepth 1 -type f -name '*.jar' -exec cp {} release/java/libs/ \;
          find java/client/build/libs -maxdepth 1 -type f -name '*.jar' -exec cp {} release/java/libs/ \;
          find java/server/build/libs -maxdepth 1 -type f -name '*.jar' -exec cp {} release/java/libs/ \;
          find java/file-server/build/libs -maxdepth 1 -type f -name '*.jar' -exec cp {} release/java/libs/ \;
          find java/converter/build/libs -maxdepth 1 -type f -name '*.jar' -exec cp {} release/java/libs/ \;
          tar -C release -czf mkp-java-${{ inputs.tag }}.tar.gz java

      - name: Upload Java artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-java
          path: mkp-java-${{ inputs.tag }}.tar.gz
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs:
      - build-python
      - build-node
      - build-cpp
      - build-dotnet
      - build-java
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          RELEASE_NAME: ${{ inputs.release_name }}
          TARGET_REF: ${{ inputs.target_ref }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          shopt -s nullglob globstar
          files=(release-assets/**/*)
          asset_files=()
          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              asset_files+=("$file")
            fi
          done

          if [ ${#asset_files[@]} -eq 0 ]; then
            echo 'No release assets found.'
            exit 1
          fi

          title="$RELEASE_NAME"
          if [ -z "$title" ]; then
            title="$TAG"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${asset_files[@]}" --clobber
          else
            if [ "$PRERELEASE" = 'true' ]; then
              gh release create "$TAG" "${asset_files[@]}" --title "$title" --target "$TARGET_REF" --generate-notes --prerelease
            else
              gh release create "$TAG" "${asset_files[@]}" --title "$title" --target "$TARGET_REF" --generate-notes
            fi
          fi
