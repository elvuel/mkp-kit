[package]
name = "mkp-rust"
version = "0.1.0"
edition = "2024"
description = "Rust port foundation for the MKP serial SDK"

[dependencies]
axum = { version = "0.8", features = ["json", "multipart"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
jsonwebtoken = { version = "10.4", features = ["rust_crypto"] }
once_cell = "1.21"
regex = "1.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serialport = "4.8"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "net", "time"] }
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3.20"
tower = { version = "0.5", features = ["util"] }

